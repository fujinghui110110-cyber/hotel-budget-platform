{% extends "base.html" %}
{% block content %}
<h1>历史版本</h1>
<table>
  <tr><th>时间</th><th>状态</th><th>文件</th><th>操作</th></tr>
  {% for upload in uploads %}
    <tr><td>{{ upload.created_at }}</td><td>{{ upload.get_status_display }}</td><td>{{ upload.original_name }}</td><td><a href="{% url 'project_upload_detail' upload.id %}">查看</a></td></tr>
  {% empty %}
    <tr><td colspan="4">暂无历史版本</td></tr>
  {% endfor %}
</table>
{% endblock %}
