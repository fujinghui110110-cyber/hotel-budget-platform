{% extends "base.html" %}
{% block content %}
<h1>项目首页</h1>
<p>当前周期：{{ cycle.name|default:"暂无开放周期" }}</p>
<p>
  <a class="button" href="{% url 'project_template' %}">下载平台标准模板 V1</a>
  <a class="button" href="{% url 'project_upload_new' %}">上传预算套表</a>
</p>
<h2>上传记录</h2>
<table>
  <tr><th>时间</th><th>状态</th><th>文件哈希</th><th>操作</th></tr>
  {% for upload in uploads %}
    <tr><td>{{ upload.created_at }}</td><td>{{ upload.get_status_display }}</td><td>{{ upload.sha256 }}</td><td><a href="{% url 'project_upload_detail' upload.id %}">查看</a></td></tr>
  {% empty %}
    <tr><td colspan="4">暂无上传</td></tr>
  {% endfor %}
</table>
{% endblock %}
